        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; }

        .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 30px; border-radius: 24px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2); }

        .sub-box { border: 1px dashed #4b5563; padding: 15px; border-radius: 16px; margin: 20px 0; font-size: 0.85rem; color: #e2e8f0; background: rgba(0,0,0,0.2); }
        .btn-qty { background: #1f2937; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-buy { background: var(--accent); color: white; border: none; padding: 14px 40px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4); }
        
        .pay-item { background: #1a1c24; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 5px 5px 15px #0e1014, -5px -5px 15px #262a34; cursor: pointer; transition: 0.3s; }
        .pay-item:hover { transform: translateY(-4px); border-color: var(--accent); }
        .pay-title { color: var(--text-muted); font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; }
        .pay-val { font-size: 0.9rem; margin-top: 6px; font-family: monospace; color: #fff; }
        
        .qris-box { background: #fff; color: #000; padding: 20px; border-radius: 16px; text-align: center; border: 4px solid var(--accent); margin-top: 25px; cursor: pointer; font-weight: 800; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        /* Tambahan Testimoni */
        .testi-container { margin-top: 40px; padding: 10px; }

</head>

<script>
